<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Instalație autonomă de stocare a energiei în baterii</title>
  <desc id="description">Containere industriale cu baterii conectate la rețeaua electrică, într-un peisaj tehnologic verde închis.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071827"/>
      <stop offset=".55" stop-color="#0f2a36"/>
      <stop offset="1" stop-color="#245f4c"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#142c32"/>
      <stop offset="1" stop-color="#07131f"/>
    </linearGradient>
    <linearGradient id="container" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf6f1"/>
      <stop offset=".55" stop-color="#c8ded3"/>
      <stop offset="1" stop-color="#83b69b"/>
    </linearGradient>
    <linearGradient id="battery" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a4d4b9"/>
      <stop offset="1" stop-color="#4b9470"/>
